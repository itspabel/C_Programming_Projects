name: Build firmware
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio
      - run: pio run
      - run: |
          mkdir -p out
          cp .pio/build/nodemcuv2/firmware.bin out/firmware.bin
          git config user.name github-actions
          git config user.email actions@github.com
          git add -f out/firmware.bin
          git commit -m "Build firmware.bin" || echo "no change"
          git push
